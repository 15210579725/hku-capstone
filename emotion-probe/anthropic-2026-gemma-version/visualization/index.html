<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemma Emotion Probes - Diary Visualization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar { width: 280px; background: #16213e; border-right: 1px solid #0f3460; overflow-y: auto; padding: 16px; flex-shrink: 0; }
.sidebar h2 { font-size: 14px; color: #a0a0a0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.seg-item { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
.seg-item:hover { background: #1a3a5c; }
.seg-item.active { background: #0f3460; border-color: #4a9eff; }
.seg-item .seg-id { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.seg-item .seg-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.seg-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #2a4a6e; color: #8ab4f8; }

/* Main content */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Top bar - emotion selector */
.topbar { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.emotion-btn { padding: 8px 14px; border: 1px solid #3a5a7e; border-radius: 6px; background: transparent; color: #c0c0c0; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.emotion-btn:hover { background: #1a3a5c; }
.emotion-btn.active { background: var(--emo-color); border-color: var(--emo-color); color: #fff; font-weight: 600; }
.norm-toggle { margin-left: auto; font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
.norm-toggle input { cursor: pointer; }

/* Heatmap area */
.heatmap-container { flex: 1; overflow-y: auto; padding: 24px; }
.token-display { line-height: 2.2; font-size: 18px; word-wrap: break-word; }
.token { display: inline; padding: 2px 1px; border-radius: 3px; cursor: default; position: relative; transition: opacity 0.1s; }
.token:hover { opacity: 0.8; outline: 1px solid #fff; }

/* Tooltip */
.tooltip { display: none; position: fixed; background: #1a1a2e; border: 1px solid #4a9eff; border-radius: 8px; padding: 10px 14px; font-size: 12px; z-index: 1000; pointer-events: none; max-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
.tooltip .tt-token { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #fff; }
.tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
.tooltip .tt-emo { color: #aaa; }
.tooltip .tt-val { font-weight: 600; font-family: monospace; }

/* Stats panel */
.stats-panel { padding: 16px 20px; background: #16213e; border-top: 1px solid #0f3460; }
.stats-title { font-size: 12px; color: #888; margin-bottom: 8px; }
.bar-chart { display: flex; gap: 6px; align-items: flex-end; height: 60px; }
.bar-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; }
.bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.3s; min-height: 2px; }
.bar-label { font-size: 10px; color: #888; margin-top: 4px; white-space: nowrap; }
</style>
</head>
<body>
<div class="sidebar">
  <h2>Segments (25)</h2>
  <div id="seg-list"></div>
</div>
<div class="main">
  <div class="topbar" id="topbar"></div>
  <div class="heatmap-container" id="heatmap-container">
    <div class="token-display" id="token-display"></div>
  </div>
  <div class="stats-panel">
    <div class="stats-title">Mean Activation per Emotion (z-scored)</div>
    <div class="bar-chart" id="bar-chart"></div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script src="data/diary_scores.js"></script>
<script>
const EMOTIONS = ['sad','curious','excited','bored','anxious','happy','tormented','angry'];
const EMO_ZH = {'sad':'悲伤','curious':'好奇','excited':'兴奋','bored':'无聊','anxious':'焦虑','happy':'幸福','tormented':'痛苦','angry':'愤怒'};
const EMO_COLORS = {'sad':'#5b8def','curious':'#f0c929','excited':'#ff6b6b','bored':'#7a7a7a','anxious':'#c084fc','happy':'#4ade80','tormented':'#ef4444','angry':'#f97316'};

let currentSeg = 0;
let currentEmo = 'happy';
let useZscore = true;

function computeZscores(scores) {
  const result = {};
  for (const emo of EMOTIONS) {
    const vals = scores[emo];
    const n = vals.length;
    const mean = vals.reduce((a,b) => a+b, 0) / n;
    const std = Math.sqrt(vals.reduce((a,b) => a + (b-mean)**2, 0) / n) || 1;
    result[emo] = vals.map(v => (v - mean) / std);
  }
  return result;
}

function scoreToColor(z) {
  const clamped = Math.max(-3, Math.min(3, z));
  const t = (clamped + 3) / 6;
  if (t < 0.5) {
    const s = t / 0.5;
    const r = Math.round(30 + s * (40 - 30));
    const g = Math.round(80 + s * (40 - 80));
    const b = Math.round(220 + s * (60 - 220));
    return `rgb(${r},${g},${b})`;
  } else {
    const s = (t - 0.5) / 0.5;
    const r = Math.round(40 + s * 215);
    const g = Math.round(40 - s * 10);
    const b = Math.round(60 - s * 30);
    return `rgb(${r},${g},${b})`;
  }
}

function rawScoreToColor(val, minVal, maxVal) {
  const range = maxVal - minVal || 1;
  const t = (val - minVal) / range;
  const z = (t - 0.5) * 6;
  return scoreToColor(z);
}

function renderSidebar() {
  const list = document.getElementById('seg-list');
  list.innerHTML = DATA.map((seg, i) => `
    <div class="seg-item ${i === currentSeg ? 'active' : ''}" onclick="selectSeg(${i})">
      <div class="seg-id">${seg.id} (${seg.num_tokens} tokens)</div>
      <div class="seg-tags">${(seg.expected_emotions||[]).map(e => `<span class="seg-tag">${EMO_ZH[e]||e}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderTopbar() {
  const topbar = document.getElementById('topbar');
  topbar.innerHTML = EMOTIONS.map(emo => `
    <button class="emotion-btn ${emo === currentEmo ? 'active' : ''}"
            style="--emo-color: ${EMO_COLORS[emo]}"
            onclick="selectEmo('${emo}')">
      ${EMO_ZH[emo]} ${emo}
    </button>
  `).join('') + `
    <label class="norm-toggle">
      <input type="checkbox" ${useZscore ? 'checked' : ''} onchange="toggleNorm(this.checked)">
      Z-score归一化
    </label>
  `;
}

function renderHeatmap() {
  const seg = DATA[currentSeg];
  const tokens = seg.tokens;
  const zscores = computeZscores(seg.scores);
  const rawScores = seg.scores[currentEmo];
  const zScoresEmo = zscores[currentEmo];

  const minRaw = Math.min(...rawScores);
  const maxRaw = Math.max(...rawScores);

  let html = '';
  for (let i = 0; i < tokens.length; i++) {
    let tok = tokens[i];
    if (tok === '<bos>' || tok === '<eos>') continue;

    const color = useZscore ? scoreToColor(zScoresEmo[i]) : rawScoreToColor(rawScores[i], minRaw, maxRaw);
    const displayTok = tok.replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Add linebreak after newlines in token
    const display = tok === '\n' ? '<br>' : `<span class="token" style="background:${color}" data-idx="${i}">${displayTok}</span>`;
    html += display;
  }

  document.getElementById('token-display').innerHTML = html;

  // Add hover listeners
  document.querySelectorAll('.token').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });

  renderStats(zscores);
}

function renderStats(zscores) {
  const chart = document.getElementById('bar-chart');
  const means = EMOTIONS.map(emo => {
    const vals = zscores[emo];
    return vals.reduce((a,b) => a+b, 0) / vals.length;
  });

  const maxAbs = Math.max(...means.map(Math.abs), 0.1);

  chart.innerHTML = EMOTIONS.map((emo, i) => {
    const h = Math.abs(means[i]) / maxAbs * 50;
    const color = EMO_COLORS[emo];
    const opacity = means[i] > 0 ? 1 : 0.4;
    return `<div class="bar-wrapper">
      <div class="bar" style="height:${h}px; background:${color}; opacity:${opacity}"></div>
      <div class="bar-label">${EMO_ZH[emo]}</div>
    </div>`;
  }).join('');
}

function showTooltip(e) {
  const idx = parseInt(e.target.dataset.idx);
  const seg = DATA[currentSeg];
  const zscores = computeZscores(seg.scores);
  const tok = seg.tokens[idx];

  const tooltip = document.getElementById('tooltip');
  let rows = EMOTIONS.map(emo => {
    const raw = seg.scores[emo][idx].toFixed(2);
    const z = zscores[emo][idx].toFixed(2);
    const color = EMO_COLORS[emo];
    return `<div class="tt-row"><span class="tt-emo" style="color:${color}">${EMO_ZH[emo]}</span><span class="tt-val">${raw} (z:${z})</span></div>`;
  }).join('');

  tooltip.innerHTML = `<div class="tt-token">"${tok}"</div>${rows}`;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY + 12) + 'px';

  // Keep tooltip in viewport
  const rect = tooltip.getBoundingClientRect();
  if (rect.right > window.innerWidth) tooltip.style.left = (e.clientX - rect.width - 12) + 'px';
  if (rect.bottom > window.innerHeight) tooltip.style.top = (e.clientY - rect.height - 12) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

function selectSeg(i) {
  currentSeg = i;
  renderSidebar();
  renderHeatmap();
}

function selectEmo(emo) {
  currentEmo = emo;
  renderTopbar();
  renderHeatmap();
}

function toggleNorm(checked) {
  useZscore = checked;
  renderHeatmap();
}

// Init
renderSidebar();
renderTopbar();
renderHeatmap();
</script>
</body>
</html>
